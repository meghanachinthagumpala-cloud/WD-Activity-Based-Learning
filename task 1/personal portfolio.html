
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Personal Portfolio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #333;
}

/* Navigation */
header {
    background: #172554;
    padding: 18px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    color: white;
    font-size: 25px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    transition: 0.3s;
}

nav a:hover {
    color: #38bdf8;
    border-bottom: 2px solid #38bdf8;
}

/* Home */
.home {
    min-height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(135deg, #1e3a8a, #7c3aed);
    color: white;
    padding: 30px;
}

.home h1 {
    font-size: 45px;
    animation: slideDown 1.5s;
}

.home p {
    font-size: 20px;
    margin: 15px;
}

.home button {
    padding: 12px 25px;
    background: #38bdf8;
    color: #172554;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

.home button:hover {
    background: white;
    transform: scale(1.1);
}

/* Sections */
section {
    padding: 65px 10%;
}

h2 {
    text-align: center;
    color: #172554;
    font-size: 30px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 25px;
    margin: 15px 0;
    border-radius: 12px;
    box-shadow: 0 4px 12px #00000015;
    transition: 0.4s;
    animation: fadeIn 1s;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 8px 20px #00000025;
}

/* Skills */
.skills {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
}

.skill {
    background: #dbeafe;
    color: #1e40af;
    padding: 15px 25px;
    border-radius: 25px;
    transition: 0.3s;
}

.skill:hover {
    background: #1e40af;
    color: white;
    transform: scale(1.1);
}

/* Resume */
.resume {
    text-align: center;
}

.resume a {
    display: inline-block;
    background: #172554;
    color: white;
    padding: 12px 25px;
    text-decoration: none;
    border-radius: 25px;
    transition: 0.3s;
}

.resume a:hover {
    background: #7c3aed;
}

/* Contact */
.contact {
    text-align: center;
}

.contact p {
    margin: 12px;
    font-size: 17px;
}

footer {
    background: #172554;
    color: white;
    text-align: center;
    padding: 20px;
}

/* Animations */
@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-50px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

/* Responsive design */
@media (max-width: 768px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    nav a {
        margin: 0;
        font-size: 14px;
    }

    .home h1 {
        font-size: 30px;
    }

    section {
        padding: 45px 6%;
    }
}
