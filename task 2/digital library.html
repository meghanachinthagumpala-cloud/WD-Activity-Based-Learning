
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Library</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f3;
            color: #333;
        }

        /* Header */
        header {
            background: #173d32;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 16px;
        }

        /* Navigation */
        nav {
            background: #245b49;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ffd166;
        }

        /* Common Sections */
        section {
            padding: 40px 8%;
        }

        h2 {
            text-align: center;
            color: #173d32;
            margin-bottom: 25px;
        }

        /* Search and Filter */
        .search-box {
            text-align: center;
            margin-bottom: 25px;
        }

        .search-box input,
        .search-box select {
            padding: 12px;
            margin: 8px;
            width: 220px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        .search-box button {
            padding: 12px 20px;
            background: #245b49;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #173d32;
        }

        /* Book Categories */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .category {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
            transition: 0.3s;
        }

        .category:hover {
            transform: translateY(-7px);
            background: #e1f2e9;
        }

        .category h3 {
            color: #245b49;
        }

        /* Book Cards */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 25px;
        }

        .book {
            background: white;
            border-radius: 10px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 4px 10px #ccc;
            transition: 0.3s;
        }

        .book:hover {
            transform: scale(1.04);
        }

        .book img {
            width: 130px;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .book h3 {
            color: #173d32;
            margin-bottom: 8px;
        }

        .book p {
            margin: 7px;
            font-size: 14px;
        }

        /* Availability Labels */
        .available {
            display: inline-block;
            background: #d4edda;
            color: #155724;
            padding: 7px 12px;
            border-radius: 15px;
            font-weight: bold;
        }

        .unavailable {
            display: inline-block;
            background: #f8d7da;
            color: #721c24;
            padding: 7px 12px;
            border-radius: 15px;
            font-weight: bold;
        }

        /* Catalog Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 13px;
            text-align: center;
        }

        th {
            background: #245b49;
            color: white;
        }

        tr:nth-child(even) {
            background: #eaf1ed;
        }

        tr:hover {
            background: #d6eadf;
        }

        /* Library Rules */
        .rules {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        .rules ul {
            padding-left: 25px;
            line-height: 2;
        }

        /* Footer */
        footer {
            background: #173d32;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        /* Responsive Design */
        @media(max-width: 600px) {
            header h1 {
                font-size: 25px;
            }

            nav a {
                display: inline-block;
                margin: 7px;
                font-size: 14px;
            }

            section {
                padding: 30px 5%;
            }

            .search-box input,
            .search-box select {
                width: 90%;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }
        }
